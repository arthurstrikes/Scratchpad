# Evening listing-day scorecard: for IPOs we reported on that listed on NSE
# today, sends the real issue, first-day open and close prices next to the GMP
# we last reported. Sends nothing on days nothing lists. Waits up to 30 minutes
# for NSE to publish the day's prices.
#
# Manual-only for now (workflow_dispatch). A weekday schedule is added in a
# separate, deliberate change once the Telegram secrets are in place.
# Replay a past day with the `date` input (e.g. 2026-10-08) and `force`.
name: IPO Watch listing scorecard

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send to Telegram (needs the two secrets)"
        type: boolean
        default: false
      date:
        description: "Replay a past day (YYYY-MM-DD), blank = today"
        type: string
        default: ""
      force:
        description: "Send again even if already sent"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ipo-watch-listing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ipo_watch/requirements.txt

      - name: Restore earlier reports (our own record of the GMP shown before listing)
        continue-on-error: true
        run: |
          mkdir -p ipo_watch/output
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch -q --depth=1 origin history
            git archive FETCH_HEAD | tar -x -C ipo_watch/output
          fi

      - name: Install dependencies
        working-directory: ipo_watch
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run listing scorecard
        id: run
        working-directory: ipo_watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_telegram) && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_telegram) && secrets.TELEGRAM_CHAT_ID || '' }}
          REPLAY_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          args="--mode listing --outdir output --fail-on-telegram-error"
          [ -n "$REPLAY_DATE" ] && args="$args --date $REPLAY_DATE"
          [ "$FORCE" = "true" ] && args="$args --force"
          python -m ipo_watch.run $args

      # Only real sends are remembered, so a dry run never marks a listing as sent.
      - name: Save the listing result to the history branch
        if: steps.run.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.send_telegram)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls ipo_watch/output/ipo-watch-listing-*.json >/dev/null 2>&1 || exit 0
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          d=$(mktemp -d)
          if ! git clone -q --depth 1 --branch history "$url" "$d" 2>/dev/null; then
            git init -q "$d"; git -C "$d" checkout -q -b history; git -C "$d" remote add origin "$url"
          fi
          cp ipo_watch/output/ipo-watch-listing-*.json ipo_watch/output/ipo-watch-listing-*.txt "$d"/ 2>/dev/null || cp ipo_watch/output/ipo-watch-listing-*.json "$d"/
          cd "$d"
          git config user.name "ipo-watch[bot]"
          git config user.email "ipo-watch@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Listing results: $(date -u +%F)"
          git push -q origin history

      - name: Keep the output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-listing-output
          path: |
            ipo_watch/output/ipo-watch-listing-*
          retention-days: 14
          if-no-files-found: ignore
