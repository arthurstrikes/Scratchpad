# Daily Mainboard IPO Watch, run by GitHub instead of a Claude session.
#
# Manual-only for now (workflow_dispatch). The daily schedule is added in a
# separate, deliberate change once the Telegram secrets are in place and one
# manual run has been confirmed - so nothing is ever sent twice.
#
# One-time setup (repo Settings > Secrets and variables > Actions > New
# repository secret):
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_CHAT_ID     the numeric chat id
name: Daily IPO Watch

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send to Telegram (needs the two secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipo-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ipo_watch/requirements.txt

      - name: Install dependencies
        working-directory: ipo_watch
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run IPO Watch
        id: run
        working-directory: ipo_watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_telegram) && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_telegram) && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python -m ipo_watch.run --outdir output

      - name: Keep the output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-output
          path: ipo_watch/output
          retention-days: 14
          if-no-files-found: ignore

      # The pipeline sends its own failure notice when it runs. This covers the
      # case where it never got that far (checkout, install, browser setup).
      - name: Tell Telegram the run never started
        if: failure() && steps.run.conclusion == 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.send_telegram)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 0
          curl -sS --max-time 20 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ IPO Watch could not start today (setup step failed). No report was sent. Details: ${RUN_URL}" >/dev/null
