# Daily Mainboard IPO Watch, run by GitHub instead of a Claude session.
#
# Manual-only for now (workflow_dispatch). The daily schedule is added in a
# separate, deliberate change once the Telegram secrets are in place and one
# manual run has been confirmed - so nothing is ever sent twice.
#
# One-time setup (repo Settings > Secrets and variables > Actions > New
# repository secret):
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_CHAT_ID     the numeric chat id
name: Daily IPO Watch

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send to Telegram (needs the two secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ipo-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ipo_watch/requirements.txt

      - name: Restore earlier reports (used as the GMP trend fallback)
        continue-on-error: true
        run: |
          mkdir -p ipo_watch/output
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch -q --depth=1 origin history
            git archive FETCH_HEAD | tar -x -C ipo_watch/output
          fi

      - name: Install dependencies
        working-directory: ipo_watch
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run IPO Watch
        id: run
        working-directory: ipo_watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_telegram) && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_telegram) && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python -m ipo_watch.run --outdir output --fail-on-telegram-error

      # Only real sends are recorded, so a manual dry run never writes history.
      - name: Save today's result to the history branch
        if: steps.run.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.send_telegram)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          d=$(mktemp -d)
          if ! git clone -q --depth 1 --branch history "$url" "$d" 2>/dev/null; then
            git init -q "$d"; git -C "$d" checkout -q -b history; git -C "$d" remote add origin "$url"
          fi
          cp ipo_watch/output/ipo-watch-*-dataset.json ipo_watch/output/ipo-watch-*.txt "$d"/
          cd "$d"
          git config user.name "ipo-watch[bot]"
          git config user.email "ipo-watch@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "History: $(date -u +%F)"
          git push -q origin history

      - name: Keep the output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-output
          path: ipo_watch/output
          retention-days: 14
          if-no-files-found: ignore

      # The pipeline sends its own failure notice when it runs. This covers the
      # case where it never got that far (checkout, install, browser setup).
      - name: Tell Telegram the run never started
        if: failure() && steps.run.conclusion == 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.send_telegram)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 0
          curl -sS --max-time 20 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ IPO Watch could not start today (setup step failed). No report was sent. Details: ${RUN_URL}" >/dev/null
